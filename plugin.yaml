name: hermes-shaperotator
version: "0.2.0"
manifest_version: 2
api_version: 1
requires_hermes: ">=0.22.7"
license: MIT
author: RobertBarnettProjects
homepage: https://github.com/RobertBarnettProjects/hermes-shaperotator
tags: [cad, engineering, freecad, inventor, drawings, fea, mechanical]
description: >-
  Parametric part and assembly design in a real CAD program. One toolset drives FreeCAD (headless,
  cross-platform) or Autodesk Inventor (Windows, COM); every feature reports its volume and topology change
  so the agent checks each step; assemblies, sheet metal, welded frames and drawings to the standard the user
  picks once per chat (AS 1100, ISO, ASME, DIN, BS 8888, JIS, GB), with a QA check before PDF export; Desktop
  pane with a live 3D view and face picking. Linear-static FEA when a design needs it, with every quoted
  stress, deflection or safety factor checked against the analyses actually run.
provides_tools:
  - cad_standard
  - cad_fea
  - cad_status
  - cad_backend
  - cad_document
  - cad_sketch
  - cad_feature
  - cad_inspect
  - cad_parameters
  - cad_drawing
  - cad_transaction
  - cad_python
  - cad_native
  - cad_plan
  - cad_history
  - cad_artifact
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  - transform_llm_output
  - on_session_finalize
config_schema:
  backend:
    type: str
    default: ""
    description: "CAD program to use: freecad or inventor. Empty: the agent asks on first use and remembers the answer"
  freecad_path:
    type: str
    default: ""
    description: "Folder containing FreeCAD's bin directory (auto-detected when empty)"
  standard:
    type: str
    default: ""
    description: "Fix one standard for every chat (AS1100, ISO, ASME, DIN, BS8888, JIS or GB). Empty: the agent asks once per chat"
  job_dir:
    type: str
    default: ""
    description: "Where models, previews and exports are written (default: plugin data dir)"
  inventor_visible:
    type: bool
    default: true
    description: "Show the Inventor window when the plugin starts Inventor"
